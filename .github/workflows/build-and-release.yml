name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build Release Binaries
        run: |
          cmake --build build --config Release --parallel

      - name: Run Unit Tests
        run: |
          .\build\tests\Release\UnitTests.exe

      - name: Package Release Assets
        id: package
        shell: pwsh
        run: |
          $distDir = "dist\SitStandReminder"
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null
          
          # 拷贝可执行文件与核心文档
          Copy-Item "build\Release\SitStandReminder.exe" -Destination "$distDir\"
          Copy-Item "README.md" -Destination "$distDir\"
          
          # 创建 ZIP 压缩包
          $zipName = "SitStandReminder-Windows-x64.zip"
          Compress-Archive -Path "$distDir\*" -DestinationPath $zipName -Force
          
          # 计算 SHA256 校验和
          $hash = (Get-FileHash -Path $zipName -Algorithm SHA256).Hash.ToLower()
          "$hash  $zipName" | Set-Content -Path "$zipName.sha256" -Encoding UTF8
          
          Write-Host "Package created: $zipName (SHA256: $hash)"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SitStandReminder-Windows-x64
          path: |
            SitStandReminder-Windows-x64.zip
            SitStandReminder-Windows-x64.zip.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SitStandReminder-Windows-x64.zip
            SitStandReminder-Windows-x64.zip.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

